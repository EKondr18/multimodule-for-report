services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO:-EKondr18/multimodule-for-report}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
