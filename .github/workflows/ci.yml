name: CI

on:
  push:
    branches: ["claude/hopeful-dirac-nk068o"]
  pull_request:
    branches: ["claude/hopeful-dirac-nk068o"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Import sanity check
        run: python -c "from app.main import app; print('OK')"

      - name: Check for tests directory
        id: check_tests
        run: echo "exists=$([ -d tests ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.check_tests.outputs.exists == 'true'
        run: python -m pytest tests

      - name: No tests yet
        if: steps.check_tests.outputs.exists == 'false'
        run: echo "backend/tests not present yet — skipping"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
