name: Keep Render backend awake

# Render Free-плана "засыпает" сервис после ~15 минут без запросов, а
# пробуждение по входящему запросу оказалось ненадёжным на практике: шлюз
# Render сдаётся ждать раньше, чем контейнер успевает подняться, и отдаёт
# 504 без CORS-заголовков (запрос даже не долетает до приложения — см.
# логи Render, где видны только служебные "Started/Finished server
# process" без единой строки от кода). Ретраи с фронтенда эту ситуацию не
# лечат — они просто провоцируют новую неудачную попытку разбудить.
#
# Пингуем лёгкий /api/health каждые 10 минут — раньше, чем сервис успеет
# уйти в сон, — чтобы он оставался тёплым и не завёл провоцировал этот сбой.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 30 https://multimodule-for-report.onrender.com/api/health
